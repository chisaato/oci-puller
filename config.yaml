server:
  addr: ":9800"
  cache_dir: "./data/cache"

log:
  level: "debug"

downloader:
  workers: 4
  chunk_size: "5MB"

registries:
  - id: "docker"
    host: "docker-local.example.com"
    # 同一 host 可配置多个上游 URL，当前按请求轮询，并在建立阶段失败时尝试后续 URL
    urls:
      - "https://registry-1.docker.io"
      - "https://registry-docker-hub.edgecompute.app"
  - id: "ghcr"
    host: "ghcr-local.example.com"
    urls:
      - "https://ghcr.io"
  - id: "lscr"
    host: "lscr-local.example.com"
    urls:
      - "https://lscr.io"
