server:
  addr: ":9800"
  cache_dir: "./data/cache"

log:
  level: "debug"

downloader:
  workers: 4
  chunk_size: "5MB"
  # 单个分片的最低瞬时速度，持续低于该值判定为长尾分片，主动中断并换连接重试。
  # 默认 "32KB"（32KB/s），设为 "0" 可禁用该检测。
  min_speed: "32KB"
  # 单个分片允许的最长完全无新字节时间，超时判定为连接已死。
  # 默认 "20s"，设为 "0" 可禁用该检测。
  stall_timeout: "20s"

registries:
  - id: "docker"
    host: "docker-local.example.com"
    # 同一 host 可配置多个上游 URL，当前按请求轮询，并在建立阶段失败时尝试后续 URL
    urls:
      - "https://registry-1.docker.io"
      - "https://registry-docker-hub.edgecompute.app"
  - id: "ghcr"
    host: "ghcr-local.example.com"
    urls:
      - "https://ghcr.io"
  - id: "lscr"
    host: "lscr-local.example.com"
    urls:
      - "https://lscr.io"
